<div class="table-container">
  <table mat-table [dataSource]="books" class="mat-elevation-z2">
    <ng-container matColumnDef="cover">
      <th mat-header-cell *matHeaderCellDef>Cover</th>

      <td mat-cell *matCellDef="let book">
        <img [src]="book.cover" [alt]="book.title" />
      </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>

      <td mat-cell *matCellDef="let book">
        {{ book.title }}
      </td>
    </ng-container>

    <ng-container matColumnDef="author">
      <th mat-header-cell *matHeaderCellDef>Author</th>

      <td mat-cell *matCellDef="let book">
        {{ book.author }}
      </td>
    </ng-container>

    <ng-container matColumnDef="year">
      <th mat-header-cell *matHeaderCellDef>Year</th>

      <td mat-cell *matCellDef="let book">
        {{ book.year }}
      </td>
    </ng-container>

    <ng-container matColumnDef="rating">
      <th mat-header-cell *matHeaderCellDef>Rating</th>

      <td mat-cell *matCellDef="let book">
        <div class="stars">
          @for (star of stars; track $index; let i = $index) {
            <mat-icon>
              {{ i < book.rating ? "star" : "star_border" }}
            </mat-icon>
          }
        </div>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" [routerLink]="['/books', row.id]" class="clickable-row"></tr>
  </table>
</div>
